<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gesture Christmas Tree</title>
<style>
  html, body { margin: 0; height: 100%; background: #02030a; overflow: hidden; font-family: "Helvetica Neue", Arial, sans-serif; color: #e8ecff; }
  canvas { display: block; }
  #hud { position: fixed; left: 20px; top: 18px; pointer-events: none; }
  #hud h1 { margin: 0; font-weight: 300; letter-spacing: .25em; font-size: 15px; color: #ffe9a8; text-transform: uppercase; }
  #status { margin-top: 6px; font-size: 12px; opacity: .75; letter-spacing: .05em; }
  #meter { margin-top: 10px; width: 160px; height: 4px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden; }
  #meterFill { height: 100%; width: 50%; background: linear-gradient(90deg,#6cf,#ffd76a,#ff6a8a); transition: width .1s; }
  #help { position: fixed; left: 20px; bottom: 18px; font-size: 11px; opacity: .55; line-height: 1.6; pointer-events: none; }
  #cam { position: fixed; right: 18px; bottom: 18px; width: 180px; border-radius: 10px; transform: scaleX(-1); opacity: .55; border: 1px solid rgba(255,255,255,.15); }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; background: radial-gradient(ellipse at center, rgba(10,14,40,.6), rgba(0,0,0,.85)); z-index: 5; }
  #start button { background: none; border: 1px solid #ffd76a; color: #ffd76a; padding: 12px 28px; border-radius: 30px; letter-spacing: .2em; text-transform: uppercase; cursor: pointer; font-size: 13px; }
  #start button:hover { background: rgba(255,215,106,.12); }
  #start p { font-size: 12px; opacity: .6; margin: 0; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud">
  <h1>✦ Gesture Tree ✦</h1>
  <div id="status">Waiting to start…</div>
  <div id="meter"><div id="meterFill"></div></div>
</div>
<div id="help">✋ Open hand → explode &nbsp;·&nbsp; ✊ Fist → condense &nbsp;·&nbsp; no hand → tree<br>No camera? Hold <b>E</b> to explode, <b>C</b> to condense · drag to orbit</div>
<video id="cam" autoplay playsinline muted></video>
<div id="start"><button id="startBtn">Enable camera</button><p>or press any key / click “skip” to use keyboard</p><button id="skipBtn" style="border-color:#8aa;color:#8aa">skip</button></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ---------- Scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x02030a, 0.02);
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 4.5, 17);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 4, 0);
controls.enableDamping = true;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.minDistance = 6; controls.maxDistance = 40;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.1, 0.6, 0.0);
composer.addPass(bloom);

// ---------- Background stars ----------
{
  const N = 4000, pos = new Float32Array(N * 3), sz = new Float32Array(N), ph = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const r = 80 + Math.random() * 120, t = Math.random() * Math.PI * 2, p = Math.acos(2 * Math.random() - 1);
    pos.set([r * Math.sin(p) * Math.cos(t), r * Math.cos(p), r * Math.sin(p) * Math.sin(t)], i * 3);
    sz[i] = Math.random() * 1.6 + 0.4; ph[i] = Math.random() * 6.28;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('size', new THREE.BufferAttribute(sz, 1));
  g.setAttribute('phase', new THREE.BufferAttribute(ph, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `attribute float size; attribute float phase; uniform float uTime; varying float vA;
      void main(){ vA = 0.45 + 0.55*sin(uTime*1.5+phase*3.0);
        vec4 mv = modelViewMatrix*vec4(position,1.); gl_PointSize = size*2.0; gl_Position = projectionMatrix*mv; }`,
    fragmentShader: `varying float vA; void main(){ float d=length(gl_PointCoord-.5); if(d>.5) discard;
        gl_FragColor = vec4(vec3(0.8,0.85,1.0), vA*smoothstep(.5,0.,d)); }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false
  });
  const stars = new THREE.Points(g, m); stars.name = 'stars'; scene.add(stars);
}

// ---------- Tree particles ----------
const H = 9, R = 3.6;
const COUNT = 16000;
const aTree = new Float32Array(COUNT * 3), aExp = new Float32Array(COUNT * 3), aCon = new Float32Array(COUNT * 3);
const aCol = new Float32Array(COUNT * 3), aSize = new Float32Array(COUNT), aRnd = new Float32Array(COUNT);
const ornamentColors = [0xff3b5c, 0xffc83d, 0x3dc8ff, 0xc77dff, 0xff8a3d, 0xffffff].map(c => new THREE.Color(c));
const col = new THREE.Color();

for (let i = 0; i < COUNT; i++) {
  const r = Math.random();
  let x, y, z, size;
  if (r < 0.04) { // star on top: 5-point star shape
    const a = Math.random() * Math.PI * 2;
    const spike = Math.pow(Math.abs(Math.cos(a * 2.5)), 6);
    const rad = (0.25 + 0.6 * spike) * Math.sqrt(Math.random());
    x = Math.sin(a) * rad; y = H + 0.55 + Math.cos(a) * rad; z = (Math.random() - .5) * 0.15;
    col.setHSL(0.13, 1, 0.55 + Math.random() * 0.25); size = 2.2 + Math.random() * 1.5;
  } else if (r < 0.13) { // ornaments on surface
    const h = Math.pow(Math.random(), 0.8), y0 = h * H * 0.95, rad = (1 - y0 / H) * R;
    const a = Math.random() * Math.PI * 2;
    x = Math.cos(a) * rad; y = y0 + 0.1; z = Math.sin(a) * rad;
    col.copy(ornamentColors[(Math.random() * ornamentColors.length) | 0]); size = 2.8 + Math.random() * 2.2;
  } else if (r < 0.17) { // garland spiral
    const t = Math.random(), y0 = t * H * 0.92, rad = (1 - y0 / H) * R * 1.03 + 0.05, a = t * Math.PI * 2 * 6;
    x = Math.cos(a) * rad; y = y0; z = Math.sin(a) * rad;
    col.setHSL(0.12, 0.9, 0.75); size = 1.2;
  } else if (r < 0.19) { // trunk
    const a = Math.random() * Math.PI * 2, rad = Math.random() * 0.45;
    x = Math.cos(a) * rad; y = -Math.random() * 1.2; z = Math.sin(a) * rad;
    col.setHSL(0.07, 0.6, 0.22); size = 1.4;
  } else { // green conical body, denser toward surface, layered branches
    const y0 = Math.pow(Math.random(), 1.3) * H;
    const layer = 0.85 + 0.15 * ((y0 * 1.4) % 1);
    const rad = (1 - y0 / H) * R * layer * Math.pow(Math.random(), 0.35);
    const a = Math.random() * Math.PI * 2;
    x = Math.cos(a) * rad; y = y0; z = Math.sin(a) * rad;
    col.setHSL(0.33 + Math.random() * 0.06, 0.75, 0.22 + Math.random() * 0.25); size = 1.0 + Math.random() * 1.2;
  }
  aTree.set([x, y, z], i * 3);
  aCol.set([col.r, col.g, col.b], i * 3);
  aSize[i] = size; aRnd[i] = Math.random();

  // explosion: random direction, wide chaotic sphere
  const d = new THREE.Vector3().randomDirection().multiplyScalar(8 + Math.random() * 18);
  aExp.set([x * 0.6 + d.x, y * 0.4 + 4 + d.y, z * 0.6 + d.z], i * 3);
  // condensed: tight glowing ball at center
  const c = new THREE.Vector3().randomDirection().multiplyScalar(Math.pow(Math.random(), 2.2) * 1.3);
  aCon.set([c.x, c.y + 4.5, c.z], i * 3);
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(aTree, 3));
geo.setAttribute('aExp', new THREE.BufferAttribute(aExp, 3));
geo.setAttribute('aCon', new THREE.BufferAttribute(aCon, 3));
geo.setAttribute('aCol', new THREE.BufferAttribute(aCol, 3));
geo.setAttribute('aSize', new THREE.BufferAttribute(aSize, 1));
geo.setAttribute('aRnd', new THREE.BufferAttribute(aRnd, 1));

const mat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uExp: { value: 0 }, uCon: { value: 0 }, uPR: { value: renderer.getPixelRatio() } },
  vertexShader: `
    attribute vec3 aExp; attribute vec3 aCon; attribute vec3 aCol; attribute float aSize; attribute float aRnd;
    uniform float uTime, uExp, uCon, uPR;
    varying vec3 vCol; varying float vTw;
    void main(){
      // per-particle staggered easing so the transition ripples instead of moving in lockstep
      float e = smoothstep(aRnd*0.35, 0.65+aRnd*0.35, uExp);
      float c = smoothstep(aRnd*0.25, 0.75+aRnd*0.25, uCon);
      vec3 p = position;
      // gentle idle sway
      p.x += sin(uTime*0.8 + position.y*0.7 + aRnd*6.0)*0.03;
      p.z += cos(uTime*0.7 + position.y*0.6 + aRnd*6.0)*0.03;
      // chaotic swirl for explosion
      vec3 ex = aExp + vec3(sin(uTime*0.9+aRnd*40.0), cos(uTime*0.7+aRnd*31.0), sin(uTime*0.8+aRnd*23.0))*1.6;
      p = mix(p, ex, e);
      // condensed: swirl around center
      float ang = uTime*(1.5+aRnd*2.0);
      vec3 cc = aCon - vec3(0.,4.5,0.);
      cc = vec3(cc.x*cos(ang)-cc.z*sin(ang), cc.y, cc.x*sin(ang)+cc.z*cos(ang)) + vec3(0.,4.5,0.);
      p = mix(p, cc, c);
      vec4 mv = modelViewMatrix*vec4(p,1.0);
      vTw = 0.7 + 0.3*sin(uTime*3.0 + aRnd*50.0);
      vCol = aCol * (1.0 + c*0.6);
      gl_PointSize = aSize * uPR * (34.0 / -mv.z) * (1.0 - 0.35*c) * (1.0 + 0.3*e);
      gl_Position = projectionMatrix*mv;
    }`,
  fragmentShader: `
    varying vec3 vCol; varying float vTw;
    void main(){
      float d = length(gl_PointCoord - 0.5);
      if (d > 0.5) discard;
      float core = smoothstep(0.5, 0.0, d);
      float a = pow(core, 1.6) * vTw;
      gl_FragColor = vec4(vCol * (0.6 + core*1.2), a);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
});
const tree = new THREE.Points(geo, mat);
scene.add(tree);

// ---------- Input / gesture state ----------
const statusEl = document.getElementById('status');
const meterFill = document.getElementById('meterFill');
let targetExp = 0, targetCon = 0;  // goals from gesture/keys
let exp = 0, con = 0;              // smoothed values
let handOpenness = null;           // 0 (fist) .. 1 (open), null = no hand
const keys = new Set();
addEventListener('keydown', e => keys.add(e.key.toLowerCase()));
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

function updateTargets() {
  if (keys.has('e')) { targetExp = 1; targetCon = 0; statusEl.textContent = 'Keyboard: explode'; return; }
  if (keys.has('c')) { targetExp = 0; targetCon = 1; statusEl.textContent = 'Keyboard: condense'; return; }
  if (handOpenness === null) { targetExp = 0; targetCon = 0; return; }
  // continuous mapping: open → explode, closed → condense, middle → tree
  const o = handOpenness;
  targetExp = THREE.MathUtils.smoothstep(o, 0.62, 0.9);
  targetCon = 1 - THREE.MathUtils.smoothstep(o, 0.2, 0.45);
  statusEl.textContent = o > 0.75 ? '✋ Open hand — explode' : o < 0.3 ? '✊ Fist — condense' : '🎄 Tree';
}

// ---------- MediaPipe hand tracking ----------
let landmarker = null, video = document.getElementById('cam'), lastVideoTime = -1;
async function startCamera() {
  statusEl.textContent = 'Loading hand model…';
  try {
    const vision = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const fileset = await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    landmarker = await vision.HandLandmarker.createFromOptions(fileset, {
      baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task', delegate: 'GPU' },
      runningMode: 'VIDEO', numHands: 1
    });
    video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
    await video.play();
    statusEl.textContent = 'Show your hand ✋';
  } catch (err) {
    console.error(err);
    statusEl.textContent = 'Camera unavailable — use E / C keys';
    video.style.display = 'none';
  }
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
function detectHand() {
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const res = landmarker.detectForVideo(video, performance.now());
  const lm = res.landmarks && res.landmarks[0];
  if (!lm) { handOpenness = null; if (!keys.size) statusEl.textContent = 'No hand — tree'; return; }
  // openness = avg fingertip distance from wrist, normalised by palm size (wrist→middle MCP)
  const palm = dist(lm[0], lm[9]) || 1e-3;
  const tips = [4, 8, 12, 16, 20];
  const avg = tips.reduce((s, t) => s + dist(lm[0], lm[t]), 0) / tips.length / palm;
  // ~1.0 for fist, ~2.0 for open hand
  const o = THREE.MathUtils.clamp((avg - 1.05) / 0.85, 0, 1);
  handOpenness = handOpenness === null ? o : handOpenness * 0.6 + o * 0.4;
}

const startEl = document.getElementById('start');
document.getElementById('startBtn').onclick = () => { startEl.remove(); startCamera(); };
document.getElementById('skipBtn').onclick = () => { startEl.remove(); video.style.display = 'none'; statusEl.textContent = 'Keyboard mode — hold E / C'; };

// ---------- Loop ----------
const clock = new THREE.Clock();
const starsMat = scene.getObjectByName('stars').material;
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  detectHand();
  updateTargets();
  // frame-rate independent smoothing; explosion is snappy, return is graceful
  exp += (targetExp - exp) * (1 - Math.exp(-dt * (targetExp > exp ? 4.5 : 2.2)));
  con += (targetCon - con) * (1 - Math.exp(-dt * (targetCon > con ? 4.0 : 2.2)));
  mat.uniforms.uTime.value = t; mat.uniforms.uExp.value = exp; mat.uniforms.uCon.value = con;
  starsMat.uniforms.uTime.value = t;
  bloom.strength = 1.0 + con * 0.9 + exp * 0.3;
  meterFill.style.width = ((handOpenness ?? 0.5) * 100).toFixed(0) + '%';
  controls.update();
  composer.render();
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
